<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>火候下部人物关系图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout: one screen. graph on the left (two towns, the ocean between them), a reading panel on the right.
   palette: 绵竹年画 mineral pigments on cool paper: 墨 朱 群青 藤黄. Same page as 上部, so the two read as a pair. */
:root{
  --paper:#f1f4ee; --panel:#fafbf7; --ink:#1b1f1c; --muted:#69706a; --rule:#cdd3ca;
  --qin:#2a302c; --qing:#d2382a; --shou:#2853b5; --huo:#bf8a00; --jiao:#98a099;
  --display:"Noto Serif SC","Songti SC","SimSun",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151816; --panel:#1c201d; --ink:#e8ebe5; --muted:#98a19a; --rule:#333a35;
    --qin:#d3d9d2; --qing:#ff6b57; --shou:#86a6ff; --huo:#e3ba3d; --jiao:#69726b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151816; --panel:#1c201d; --ink:#e8ebe5; --muted:#98a19a; --rule:#333a35;
  --qin:#d3d9d2; --qing:#ff6b57; --shou:#86a6ff; --huo:#e3ba3d; --jiao:#69726b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6;display:grid;grid-template-rows:auto 1fr}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;padding:14px 20px 10px;border-bottom:1px solid var(--rule)}
h1{font-family:var(--display);font-weight:900;font-size:22px;margin:0;letter-spacing:.04em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.chip{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:3px;padding:3px 10px 3px 8px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip svg{flex:none}
.chip b{font-weight:500}
.chip span{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{opacity:.38;text-decoration:line-through}
.chip:focus-visible,.node:focus-visible,.who:focus-visible{outline:2px solid var(--shou);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
.stage{min-width:0;min-height:0;overflow:auto}
#g{display:block;width:100%;height:100%;min-width:880px;touch-action:none;user-select:none}
aside{background:var(--panel);border-left:1px solid var(--rule);padding:18px 20px 24px;overflow:auto}
aside h2{font-family:var(--display);font-weight:900;font-size:26px;margin:0 0 2px}
aside h3{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.12em;margin:20px 0 6px}
aside p{margin:6px 0}
.town{font-size:12px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(22,1fr);gap:2px;margin-top:4px}
.strip i{height:14px;border:1px solid var(--rule);border-radius:1px}
.strip i.on{background:var(--ink);border-color:var(--ink)}
.stripcap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
li{display:grid;grid-template-columns:10px 1fr;gap:8px;align-items:baseline}
li::before{content:"";width:10px;height:3px;border-radius:1px;background:var(--c);transform:translateY(-3px)}
.who{font:inherit;font-weight:700;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--rule);padding:0;cursor:pointer}
.note{color:var(--muted);font-size:13px}
.edge{fill:none;stroke-linecap:round}
.edge.qin{stroke:var(--qin);stroke-width:1.7}
.edge.qing{stroke:var(--qing);stroke-width:2.1}
.edge.shou{stroke:var(--shou);stroke-width:3.2}
.edge.huo{stroke:var(--huo);stroke-width:1.5}
.edge.jiao{stroke:var(--jiao);stroke-width:1.3;stroke-dasharray:1.5 4.5}
.edge.cheat{stroke-dasharray:7 5}
.arrow{fill:var(--shou)}
.elabel{font-size:12px;fill:var(--ink);stroke:var(--paper);stroke-width:4px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;display:none;pointer-events:none}
.elabel.on{display:block}
.node{cursor:pointer}
.node circle{stroke:var(--ink);stroke-width:2}
.node.cd circle{fill:var(--ink)}
.node.lf circle{fill:var(--paper)}
.node.hf circle{fill:var(--muted);stroke:var(--muted)}
.node text{font-size:13.5px;font-weight:500;fill:var(--ink);stroke:var(--paper);stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle}
.node.sel circle{stroke:var(--qing);stroke-width:4}
.dim{opacity:.1}
.hide{display:none}
.place{font-family:var(--display);font-weight:900;font-size:54px;fill:var(--ink);opacity:.07}
.sea{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 7}
.seacap{font-size:11.5px;fill:var(--muted);letter-spacing:.3em}
@media (max-width:860px){
  body{display:block}
  main{display:block}
  .stage{height:62vh}
  aside{border-left:0;border-top:1px solid var(--rule)}
  .legend{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.node,.edge{transition:opacity .15s}}
footer{padding:6px 20px 8px;border-top:1px solid var(--rule);color:var(--muted);font-size:12px}
footer a{color:inherit}
</style>
<meta name="author" content="李星光"><meta name="robots" content="noai, noimageai"><meta name="tdm-reservation" content="1">

<body>
<header>
  <h1>火候 · 下部人物关系</h1>
  <p id="sub"></p>

</header>
<main>
  <div class="stage">
    <svg id="g" viewBox="0 0 1440 1060" preserveAspectRatio="xMidYMid meet" role="img" aria-label="《火候》下部的人物关系网：左边成都，右边拉法叶，蓝色箭头是谁的手伸到谁那儿">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"/></marker></defs>
      <text class="place" x="34" y="72">成都</text>
      <text class="place" x="752" y="72">拉法叶</text>
      <line class="sea" x1="716" y1="150" x2="716" y2="1020"/>
      <text class="seacap" x="716" y="1046" text-anchor="middle">一万两千公里 · 十三个钟头</text>
      <g id="edges"></g><g id="labels"></g><g id="nodes"></g>
    </svg>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<footer>© 2026 李星光 · 保留所有权利 · <a href="../#rights">版权与转载</a></footer>
<script>
const D={"nodes": [{"id": "老蒲", "town": "成都", "x": 500, "y": 300, "d": "蒲记的灶。手叫机器学了去，天府四楼那口锅比他“早了三百”。初八去了民政局。", "c": 147, "ch": [23, 24, 26, 27, 28, 29, 30, 31, 32, 35, 37, 39, 40, 41, 42, 43, 44]}, {"id": "蒲嬢嬢", "town": "成都", "x": 360, "y": 205, "d": "蒲记的收银台，营业执照上是她的三个字。十六，一个人推着行李车出了芝加哥的到达口。", "c": 95, "ch": [24, 26, 27, 29, 30, 31, 32, 33, 35, 37, 39, 40, 41, 42, 43, 44]}, {"id": "二嬢", "town": "成都", "x": 250, "y": 110, "d": "蒲嬢嬢的表妹，舅舅的女，从小喊的姐、妹。住郫都，带着孙女。十五那天办坝坝宴。", "c": 43, "ch": [24, 26, 39, 40, 41, 42, 43, 44]}, {"id": "苗苗", "town": "成都", "x": 150, "y": 200, "d": "七岁，二嬢的孙女，爸妈在上海。偷青那一夜，她把手环留在了灶台上。", "c": 43, "ch": [24, 26, 39, 41, 42, 43]}, {"id": "老邓", "town": "成都", "x": 300, "y": 975, "d": "邓建国，七十一岁，独居，守着一条叫铁锅的老狗。", "c": 40, "ch": [24, 27, 35, 37, 40]}, {"id": "徐好翔", "town": "成都", "x": 230, "y": 400, "d": "耍起老店的老板。后屋白天打麻将，夜里那张沙发给没处睡的人。", "c": 60, "ch": [23, 26, 28, 33, 34, 35, 36, 38, 39, 40, 41, 44]}, {"id": "汪蓉", "town": "成都", "x": 290, "y": 540, "d": "徐好翔的老婆。病房里要家属签字，她写了一个字。", "c": 91, "ch": [23, 25, 26, 28, 30, 32, 33, 34, 35, 36, 38, 39, 40, 44]}, {"id": "钟姐", "town": "成都", "x": 140, "y": 610, "d": "五十五岁，楼和许可证都是她的。装了起搏器，一个人住。十六早上没醒过来。", "c": 95, "ch": [23, 25, 26, 27, 28, 30, 33, 34, 35, 40, 42, 44]}, {"id": "梓涵", "town": "成都", "x": 105, "y": 470, "d": "二十岁，后屋原来最小的那个。分期换了一副好看的身子，钱还没还完，活路先没了。", "c": 24, "ch": [23, 24, 33, 35, 36, 40, 44]}, {"id": "乐子", "town": "成都", "x": 430, "y": 655, "d": "后屋的团长，杭州人。沙发睡到头了，一路往东，回了他爸那张书桌。", "c": 101, "ch": [23, 28, 31, 35, 40, 41, 42, 43, 44]}, {"id": "邱野", "town": "成都", "x": 545, "y": 515, "d": "后屋的手。基因徽章跳出一项新的匹配，他把眼镜扣在桌上。", "c": 34, "ch": [23, 25, 28, 32, 36, 37, 42, 44]}, {"id": "唐蕾", "town": "成都", "x": 400, "y": 430, "d": "后屋的手。“还是一个人好耍。”", "c": 50, "ch": [23, 25, 26, 27, 28, 32, 35, 36, 37, 40, 41, 42]}, {"id": "胡师傅", "town": "成都", "x": 195, "y": 300, "d": "开了二十几年公交，如今在天府教人开真车。", "c": 18, "ch": [25, 37, 42]}, {"id": "王鹏", "town": "成都", "x": 420, "y": 775, "d": "后屋的手，如今在家开护理机器人，一单几块钱。左手无名指还翘着。", "c": 88, "ch": [25, 26, 27, 30, 35, 36, 40, 41, 42, 44]}, {"id": "何蔓", "town": "成都", "x": 585, "y": 735, "d": "后屋的手，如今也开护理机器人。替八十三个人去谈了价钱。", "c": 93, "ch": [25, 26, 27, 30, 35, 38, 39, 40, 41, 42]}, {"id": "铁子", "town": "成都", "x": 625, "y": 420, "d": "沈阳人。无犯罪证明开不出来，近邻不要他，在蒲记系上了围裙。", "c": 83, "ch": [23, 26, 27, 29, 30, 35, 37, 39, 40, 44]}, {"id": "邓晓燕", "town": "成都", "x": 265, "y": 800, "d": "华西的护士。屋里只剩一张沙发，别的都装了箱。下礼拜一登记。", "c": 45, "ch": [23, 28, 34, 35, 37, 41, 42]}, {"id": "老罗", "town": "成都", "x": 110, "y": 860, "d": "六十二岁，卖了一辈子豆瓣和底料。灶上给她煮醪糟蛋。", "c": 26, "ch": [23, 28, 37, 41, 42]}, {"id": "罗佳", "town": "成都", "x": 160, "y": 965, "d": "老罗的女儿，在城西开宠物医院。她妈那间屋还留着。", "c": 25, "ch": [28, 37, 41, 42]}, {"id": "王芳", "town": "成都", "x": 455, "y": 900, "d": "王鹏的姐姐，在快递站上班。一本绿存折锁了十二年。", "c": 17, "ch": [25, 36]}, {"id": "张一帆", "town": "成都", "x": 510, "y": 800, "d": "十五岁，王芳的儿子。在户口本里翻出了那本存折。", "c": 41, "ch": [25, 32, 33, 36, 42]}, {"id": "张磊", "town": "成都", "x": 650, "y": 965, "d": "张一帆的爸。在天府儿童层给别人的娃娃扎小辫，胸牌上写“真人陪伴”。", "c": 16, "ch": [25, 32, 33, 36, 42]}, {"id": "何蔓她妈", "town": "成都", "x": 690, "y": 770, "d": "五十五岁，住城东，想女儿搬回来。", "c": 18, "ch": [25, 42]}, {"id": "何蔓她爸", "town": "成都", "x": 695, "y": 850, "d": "西充人，五十八，包川北小水电站的检修。前年换了一边瓷胯骨，工地如今是二爸在跑。", "c": 25, "ch": [25, 38, 42]}, {"id": "二爸", "town": "成都", "x": 710, "y": 930, "d": "何蔓她爸的兄弟，是他带出来的。满四十那年当着一工地的人挨过他一耳光，如今替他跑工地。", "c": 7, "ch": [38]}, {"id": "幺爷爷", "town": "西充", "x": 670, "y": 900, "d": "何蔓的爷爷的兄弟，快八十了，还在坡上挖土，人家撂了的地，他一块一块捡起来种。", "c": 3, "ch": [38]}, {"id": "何蔓的爷爷", "town": "成都", "x": 620, "y": 880, "d": "八十三岁，西充人，一天绕湖走一圈，认树只问好不好烧。缺一颗门牙，边走边哼。", "c": 30, "ch": [38]}, {"id": "何小琴", "town": "成都", "x": 630, "y": 820, "d": "何蔓的嬢嬢，五十出头。在天府的排队街替儿子争回了三杯奶茶。", "c": 7, "ch": [39]}, {"id": "毛毛", "town": "成都", "x": 570, "y": 800, "d": "二十三岁，学会计的，在排队街当充场的，一个钟头四十。", "c": 9, "ch": [38, 39]}, {"id": "罗艳", "town": "成都", "x": 460, "y": 830, "d": "老罗的妹妹，五十上下，包着天府六楼那个湖的防水。“房子漏了我补，男人漏了我换。”", "c": 10, "ch": [39]}, {"id": "周小蔓", "town": "丰县", "x": 360, "y": 670, "d": "四十一岁，丰县周家饭馆灶上的人。年年初九带着咸菜、烙馍和一把剃头刀过江。", "c": 3, "ch": [35]}, {"id": "冉峥他妈", "town": "成都", "x": 450, "y": 190, "d": "礼拜六在人民公园相亲角撑一把黑伞。“我是懒得离。”", "c": 68, "ch": [23, 24, 25, 26, 27, 30, 32, 33, 35, 36, 38, 39, 40, 41, 42, 44]}, {"id": "冉峥他爸", "town": "成都", "x": 480, "y": 140, "d": "退了休的举重教练，五十六公斤级，个子只到老婆耳朵。两个数记了三十几年。", "c": 8, "ch": [33, 36]}, {"id": "姥爷", "town": "成都", "x": 350, "y": 130, "d": "蒲嬢嬢的爸，南京人，姓曾，五一年生，七〇年跟着厂子进的川。就秀芬一个女，带大了蒲青。八十九岁走的。", "c": 26, "ch": [41, 42, 44]}, {"id": "六嬢", "town": "成都", "x": 390, "y": 80, "d": "九十八岁，她们妈的堂姐，在重庆接了一辈子生。一大家人年年正月团一回，都是她喊。", "c": 35, "ch": [41, 42, 44]}, {"id": "九嬢", "town": "成都", "x": 420, "y": 140, "d": "八十九岁，手里一个小本子，一个晚辈一页。隔着太平洋给蒲青打电话，问吃饭没得。", "c": 13, "ch": [30, 41, 42, 43, 44]}, {"id": "十嬢", "town": "成都", "x": 450, "y": 90, "d": "八十三岁，头发染得黢黑，脚一沾地就问哪一桌打麻将。", "c": 7, "ch": [41, 42, 43]}, {"id": "邹婆婆", "town": "成都", "x": 680, "y": 645, "d": "八十四岁，驷马桥六楼。儿子媳妇在上海。", "c": 6, "ch": [30]}, {"id": "老范", "town": "成都", "x": 42, "y": 555, "d": "六十九岁，靠三套房的房租过日子，一天编一个故事。十六下午捏着一张二条：“编不出来。”", "c": 35, "ch": [23, 24, 27, 29, 32, 40, 41, 44]}, {"id": "黄嬢嬢", "town": "成都", "x": 48, "y": 665, "d": "老范的老婆，管账本，一页一个房子。他编一回，她说一回“又来了”。十六那天她没说。", "c": 32, "ch": [23, 27, 29, 32, 40, 41, 44]}, {"id": "严嬢嬢", "town": "成都", "x": 48, "y": 300, "d": "六十七岁，在春熙路卖了二十年鞋，看人先看脚。证不领，十四那天在公证处签了一张纸。", "c": 34, "ch": [24, 26, 32, 34, 39, 40, 44]}, {"id": "老温", "town": "成都", "x": 70, "y": 390, "d": "七十一岁，退休的体育老师，只会慢四。户口本在儿子那儿。“这个不是证。”", "c": 36, "ch": [24, 26, 32, 34, 39, 40, 44]}, {"id": "卢嬢嬢", "town": "成都", "x": 45, "y": 775, "d": "手搓汤圆，一碗八个。“我这个是人搓的，也要人煮。”", "c": 8, "ch": [41]}, {"id": "老喻", "town": "成都", "x": 45, "y": 885, "d": "卢嬢嬢的老伴，蹬三轮，爱编。“编的也对。”", "c": 4, "ch": [41]}, {"id": "陈嬢嬢", "town": "成都", "x": 690, "y": 560, "d": "七十三岁，儿子在深圳，女儿在澳大利亚。长护险评了中度。照了饭发给儿子，回一个大拇指。", "c": 23, "ch": [29, 38]}, {"id": "钱维岳", "town": "常熟", "x": 540, "y": 650, "d": "姓钱，杭州人，一个人住在常熟。讲了一天话，开机器的人一句没接住。", "c": 38, "ch": [35, 40, 41, 42]}, {"id": "季大有", "town": "丰县", "x": 470, "y": 720, "d": "丰县，四张长条桌，一碗面三块钱。", "c": 14, "ch": [31]}, {"id": "阿包", "town": "上海", "x": 580, "y": 570, "d": "乐清人，六十三，公司开在楚格。二九年八月把手上的夜全卖给了钱总；十五那天，复核那一栏签在陈阿姨的名字底下。", "c": 21, "ch": [41, 43, 44]}, {"id": "陈阿姨", "town": "上海", "x": 560, "y": 430, "d": "六十八，退休的公证员，一个月签两百份。“搿只手，老早就烫坏脱了。”", "c": 13, "ch": [36, 41]}, {"id": "虹姐", "town": "深圳", "x": 480, "y": 520, "d": "乐清人，在深圳开排档。灵堂上端出一盘炒粉干：“先挂着。”", "c": 5, "ch": [41, 43, 44]}, {"id": "安思危", "town": "杭州", "x": 390, "y": 570, "d": "五十多岁，一身蓝西装。二九年没借钱给钱维岳；乐子问机器的那些话，他抄下来，白送。", "c": 7, "ch": [44]}, {"id": "江烈", "town": "乌江", "x": 260, "y": 640, "d": "四十，长江边上的救援队员。从二月的江里背上来一个老头：“是谁家的？”", "c": 6, "ch": [35]}, {"id": "琳她妈", "town": "合肥", "x": 655, "y": 95, "d": "梅姐和琳的妈，在合肥。身子借不成了，就对着屏幕讲那张床，讲出一张画来。", "c": 14, "ch": [25, 36, 44]}, {"id": "蒲青", "town": "拉法叶", "x": 810, "y": 255, "d": "老蒲的儿子。十五上午在县法院结了婚，站在台阶上给他爸打视频。", "c": 115, "ch": [24, 26, 30, 34, 38, 39, 40, 42, 43, 44]}, {"id": "路易斯", "town": "拉法叶", "x": 900, "y": 150, "d": "蒲青屋里的人，现在是丈夫。金环卡在指节上，戴到了小指头。", "c": 84, "ch": [26, 30, 34, 38, 39, 40, 42, 43, 44]}, {"id": "玛丽索尔", "town": "拉法叶", "x": 790, "y": 440, "d": "夜里的身子如今由马尼拉的人开。三页协议搁在冰箱顶上。", "c": 16, "ch": [26, 27, 30, 42, 43]}, {"id": "乔伊", "town": "马尼拉", "x": 770, "y": 545, "d": "四十一岁，三个孩子，在马尼拉两班倒。没见过拉法叶的白天。", "c": 5, "ch": [26]}, {"id": "梅姐", "town": "拉法叶", "x": 985, "y": 330, "d": "老火车站的老板娘。欠的三个月房租刚填上，下个月的还没着落。", "c": 47, "ch": [28, 29, 30, 31, 39, 41, 44]}, {"id": "方姐", "town": "拉法叶", "x": 860, "y": 300, "d": "六十，瘦，小，在拉法叶开指甲店。嫁的是本地一个老头，七点半不到就扶他起来，开车送他回去。", "c": 4, "ch": [44]}, {"id": "文", "town": "拉法叶", "x": 1100, "y": 235, "d": "梅姐的男人。这一回，他躺在迎风的那一边。", "c": 25, "ch": [28, 30, 41, 44]}, {"id": "三个孩子", "town": "拉法叶", "x": 1010, "y": 130, "d": "小浩、朱妮、念念。", "c": 12, "ch": [28, 29, 35, 37, 41]}, {"id": "琳", "town": "拉法叶", "x": 1150, "y": 385, "d": "梅姐的妹妹，种蒜的。日历翻到九月，画了一个圈。", "c": 47, "ch": [23, 25, 29, 31, 36, 41, 44]}, {"id": "凯", "town": "拉法叶", "x": 1260, "y": 290, "d": "琳的男人。新表上先写的是他的名字。", "c": 44, "ch": [23, 24, 25, 29, 31, 36, 41, 4     <p>一个圆是一个人，圆越大，书里提到的回数越多。实心是成都，空心是拉法叶，灰的在别处：上海、杭州、常熟、深圳、乌江、合肥、丰县、西充、马尼拉、莱克伍德。一条线是书里写出来的一层关系，颜色分五种，上头的按钮可以关掉一种。</p>
    <p>点一个人，只剩下他那一圈；再点一下放开。圆可以拖。</p>
    <h3>线最多的人</h3><ul>${deg.map(([k,d])=>`<li style="--c:var(--ink)"><span><button class="who" data-id="${k}">${k}</button>　<span class="note">${d} 条</span></span></li>`).join('')}</ul>
    <h3>没连上大网的</h3><ul>${comps.slice(1).map(c=>`<li style="--c:var(--jiao)"><span>${c.map(k=>`<button class="who" data-id="${k}">${k}</button>`).join('、')}</span></li>`).join('')||'<li style="--c:var(--jiao)"><span class="note">没有</span></li>'}</ul>
    <p class="note">大网里有 ${comps[0].length} 个人。</p>
    <h3>只挂着一条线的</h3>
    <p class="note">${one.map(k=>`<button class="who" data-id="${k}">${k}</button>`).join('、')}</p>
    <h3>跨过中间那条线的</h3>
    <p class="note">${cx.length} 条：亲 ${by('qin')}，钱 ${by('huo')}，相识 ${by('jiao')}，情 ${by('qing')}，手 ${by('shou')}。从成都伸到拉法叶的手，这一部里一只也没有了；剩下那一只是从马尼拉伸过来的。蓝箭头如今都落在成都自己的老人身上。</p>
    <p class="note">${LEFT_OUT}</p>
    <p class="note">v5 · 只画下部，第二十三章到第四十四章。v2 加上了巷子里的老人；v3 加上了长三角的几个人；v4 加上了曾家的三个嬢嬢和那位南京来的姥爷，何蔓的爷爷、嬢嬢和表弟，罗艳母子，周小蔓，冉峥的爸妈；v5 加上了西充的幺爷爷、何蔓的二爸和拉法叶开指甲店的方姐，二嬢改成了蒲嬢嬢的表妹，韩临只剩别人嘴里的一个名字。</p>`;
  }else{
    const n=byId[id],grp={};n.es.forEach(e=>{(grp[e.t]=grp[e.t]||[]).push(e)});
    const cells=Array.from({length:22},(_,i)=>`<i class="${n.ch.includes(i+23)?'on':''}" title="第${i+23}章"></i>`).join('');
    panel.innerHTML=`<h2>${esc(n.id)}</h2><div class="town">${n.town} · ${n.es.length} 条线 · 提到 ${n.c} 回</div><p>${esc(n.d)}</p>
    <h3>在哪几章提到</h3><div class="strip">${cells}</div><div class="stripcap"><span>23</span><span>33</span><span>44</span></div>
    ${Object.keys(T).filter(t=>grp[t]).map(t=>`<h3>${T[t][0]} · ${T[t][1]}</h3><ul>${grp[t].map(e=>{const o=e.a===id?e.b:e.a,dir=e.t==='shou'?(e.a===id?'伸到 ':''):'';
      return `<li style="--c:var(--${t})"><span>${dir}<button class="who" data-id="${o}">${o}</button>${e.t==='shou'&&e.a!==id?' 的手伸过来':''}　<span class="note">${esc(e.l)}</span></span></li>`}).join('')}</ul>`).join('')}`;
  }
  panel.querySelectorAll('.who').forEach(b=>b.addEventListener('click',()=>{sel=b.dataset.id;hov=null;paint()}));
}
const swatch=t=>`<svg width="26" height="10" aria-hidden="true"><line x1="1" y1="5" x2="${t==='shou'?19:25}" y2="5" class="edge ${t}"${t==='shou'?' marker-end="url(#arr)"':''}/></svg>`;
document.getElementById('legend').innerHTML=Object.keys(T).map(t=>`<button class="chip" aria-pressed="true" data-t="${t}" title="${T[t][1]}">${swatch(t)}<b>${T[t][0]}</b><span>${T[t][2]} · ${D.edges.filter(e=>e.t===t).length}</span></button>`).join('')+`<button class="chip" aria-pressed="true" data-t="cheat" title="瞒着家里人的" disabled style="cursor:default"><svg width="26" height="10" aria-hidden="true"><line x1="1" y1="5" x2="25" y2="5" class="edge qing cheat"/></svg><b>瞒着人的</b><span>虚线 · ${D.edges.filter(e=>e.x).length}</span></button>`;
document.querySelectorAll('.chip[data-t]').forEach(b=>{if(b.dataset.t==='cheat')return;b.addEventListener('click',()=>{const t=b.dataset.t;off.has(t)?off.delete(t):off.add(t);b.setAttribute('aria-pressed',String(!off.has(t)));paint()})});
document.getElementById('sub').textContent=`${D.nodes.length} 个人，${D.edges.length} 条线。左边成都，右边拉法叶。`;
const q0=new URLSearchParams(location.search).get('sel');if(q0&&byId[q0])sel=q0;
place();paint();
</script>
</body>
</html>
